[env:esp32dev]
; pioarduino platform provides a complete PlatformIO integration for
; Arduino-ESP32 Core 3.x, including the matching ESP-IDF libraries.
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200

lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

build_flags =
    -DCORE_DEBUG_LEVEL=0
