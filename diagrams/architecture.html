<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情緒垃圾車 · 系統架構</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f2e6d8;
      --color-ink:     #593e2e;
      --color-muted:   #63554b;
      --color-accent:  #8c5b3e;
      --color-moss:    #555934;
      --color-sand:    #bf9b7a;
      --font-sans:     'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .frame { max-width: 1120px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1080px; display: block; }
    .diagram-container { width: 100%; overflow-x: auto; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="eyebrow">System · hardware + backend</div>
    <h1>系統架構</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="emotion-arch-title emotion-arch-desc">
        <title id="emotion-arch-title">情緒垃圾車系統架構</title>
        <desc id="emotion-arch-desc">ESP32 硬體與 Web 模擬器透過 FastAPI 與 SQL 串接；API 不可用時降級為 demo fallback，Wokwi 作為硬體模擬展示。</desc>
        <defs>
          <marker id="arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#63554b"/></marker>
          <marker id="arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8c5b3e"/></marker>
          <marker id="arch-arrow-moss" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#555934"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f2e6d8"/>

        <text x="60" y="48" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">ONE SYSTEM · THREE LAYERS</text>

        <!-- ===== ZONES ===== -->
        <rect x="60" y="100" width="440" height="340" rx="8" fill="rgba(85,89,52,0.03)" stroke="rgba(89,62,46,0.12)" stroke-width="0.8"/>
        <rect x="68" y="104" width="128" height="14" rx="2" fill="#f2e6d8"/>
        <text x="132" y="115" fill="#63554b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">USER · HARDWARE</text>

        <rect x="580" y="100" width="440" height="340" rx="8" fill="rgba(89,62,46,0.03)" stroke="rgba(89,62,46,0.12)" stroke-width="0.8"/>
        <rect x="588" y="104" width="112" height="14" rx="2" fill="#f2e6d8"/>
        <text x="644" y="115" fill="#63554b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">BACKEND · DATA</text>

        <!-- ===== ARROWS (before nodes) ===== -->
        <!-- ESP32 → Wokwi -->
        <line x1="250" y1="216" x2="320" y2="216" stroke="#63554b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow)"/>
        <rect x="258" y="204" width="56" height="12" rx="2" fill="#f2e6d8"/>
        <text x="286" y="214" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">硬體模擬</text>

        <!-- ESP32 → Web 模擬器 -->
        <line x1="175" y1="252" x2="175" y2="300" stroke="#63554b" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
        <rect x="150" y="262" width="52" height="12" rx="2" fill="#f2e6d8"/>
        <text x="176" y="272" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">狀態同步</text>

        <!-- Web 模擬器 → FastAPI -->
        <line x1="250" y1="336" x2="640" y2="336" stroke="#63554b" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
        <rect x="398" y="322" width="96" height="12" rx="2" fill="#f2e6d8"/>
        <text x="446" y="332" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">POST /api/sim/*</text>

        <!-- FastAPI → SQL -->
        <line x1="715" y1="252" x2="715" y2="300" stroke="#555934" stroke-width="1.2" marker-end="url(#arch-arrow-moss)"/>
        <rect x="695" y="262" width="40" height="12" rx="2" fill="#f2e6d8"/>
        <text x="715" y="272" fill="#555934" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">寫入</text>

        <!-- FastAPI → Demo fallback -->
        <path d="M 790,216 V 276 H 840" fill="none" stroke="#8c5b3e" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arch-arrow-accent)"/>
        <rect x="792" y="226" width="60" height="12" rx="2" fill="#f2e6d8"/>
        <text x="822" y="236" fill="#8c5b3e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">API 不可用</text>

        <!-- SQL → Web 模擬器 (return) -->
        <path d="M 715,372 V 400 H 175 V 372" fill="none" stroke="#63554b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow)"/>
        <rect x="386" y="388" width="96" height="12" rx="2" fill="#f2e6d8"/>
        <text x="434" y="398" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">GET /api/stats/*</text>

        <!-- ===== NODES ===== -->
        <!-- ESP32 -->
        <rect x="100" y="180" width="150" height="72" rx="8" fill="#ffffff" stroke="#593e2e" stroke-width="1"/>
        <rect x="108" y="188" width="40" height="12" rx="2" fill="none" stroke="rgba(89,62,46,0.40)" stroke-width="0.8"/>
        <text x="128" y="197" fill="#593e2e" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DEVICE</text>
        <text x="175" y="220" fill="#593e2e" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">ESP32</text>
        <text x="175" y="236" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">搖桿 · LCD · LED · 蜂鳴器</text>

        <!-- Wokwi -->
        <rect x="320" y="180" width="150" height="72" rx="8" fill="rgba(89,62,46,0.02)" stroke="#593e2e" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="328" y="188" width="48" height="12" rx="2" fill="none" stroke="rgba(89,62,46,0.40)" stroke-width="0.8"/>
        <text x="352" y="197" fill="#593e2e" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
        <text x="395" y="220" fill="#593e2e" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">Wokwi</text>
        <text x="395" y="236" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">硬體模擬展示</text>

        <!-- Web 模擬器 -->
        <rect x="100" y="300" width="150" height="72" rx="8" fill="#ffffff" stroke="#593e2e" stroke-width="1"/>
        <rect x="108" y="308" width="40" height="12" rx="2" fill="none" stroke="rgba(89,62,46,0.40)" stroke-width="0.8"/>
        <text x="128" y="317" fill="#593e2e" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="175" y="340" fill="#593e2e" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">Web 模擬器</text>
        <text x="175" y="356" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Game Boy 風格</text>

        <!-- FastAPI -->
        <rect x="640" y="180" width="150" height="72" rx="8" fill="#ffffff" stroke="#593e2e" stroke-width="1"/>
        <rect x="648" y="188" width="40" height="12" rx="2" fill="none" stroke="rgba(89,62,46,0.40)" stroke-width="0.8"/>
        <text x="668" y="197" fill="#593e2e" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SERVICE</text>
        <text x="715" y="220" fill="#593e2e" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">FastAPI</text>
        <text x="715" y="236" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">REST + WebSocket</text>

        <!-- SQL -->
        <rect x="640" y="300" width="150" height="72" rx="8" fill="#ffffff" stroke="#555934" stroke-width="1"/>
        <rect x="648" y="308" width="40" height="12" rx="2" fill="none" stroke="rgba(85,89,52,0.40)" stroke-width="0.8"/>
        <text x="668" y="317" fill="#555934" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="715" y="340" fill="#593e2e" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">SQL</text>
        <text x="715" y="356" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">情緒 · 清運 · 統計</text>

        <!-- Demo fallback -->
        <rect x="840" y="240" width="150" height="72" rx="8" fill="rgba(140,91,62,0.08)" stroke="#8c5b3e" stroke-width="1.2"/>
        <rect x="848" y="248" width="48" height="12" rx="2" fill="none" stroke="rgba(140,91,62,0.50)" stroke-width="0.8"/>
        <text x="872" y="257" fill="#8c5b3e" font-size="6.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FALLBACK</text>
        <text x="915" y="280" fill="#593e2e" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">Demo fallback</text>
        <text x="915" y="296" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">API 不可用時啟用</text>

        <!-- ===== LEGEND ===== -->
        <line x1="60" y1="470" x2="1020" y2="470" stroke="rgba(89,62,46,0.10)" stroke-width="0.8"/>
        <text x="60" y="488" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="78" y="502" width="14" height="14" rx="2" fill="#ffffff" stroke="#593e2e" stroke-width="1"/>
        <text x="100" y="514" fill="#63554b" font-size="8.5" font-family="'Geist', 'Noto Sans TC', sans-serif">實體元件</text>

        <rect x="200" y="502" width="14" height="14" rx="2" fill="rgba(89,62,46,0.02)" stroke="#593e2e" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="222" y="514" fill="#63554b" font-size="8.5" font-family="'Geist', 'Noto Sans TC', sans-serif">外部展示（Wokwi）</text>

        <rect x="370" y="502" width="14" height="14" rx="2" fill="rgba(140,91,62,0.08)" stroke="#8c5b3e" stroke-width="1"/>
        <text x="392" y="514" fill="#63554b" font-size="8.5" font-family="'Geist', 'Noto Sans TC', sans-serif">編輯焦點：Demo fallback</text>

        <line x1="560" y1="509" x2="578" y2="509" stroke="#63554b" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
        <text x="586" y="514" fill="#63554b" font-size="8.5" font-family="'Geist', 'Noto Sans TC', sans-serif">正向呼叫</text>

        <line x1="680" y1="509" x2="698" y2="509" stroke="#63554b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow)"/>
        <text x="706" y="514" fill="#63554b" font-size="8.5" font-family="'Geist', 'Noto Sans TC', sans-serif">回傳 / 降級</text>

        <text x="60" y="542" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-style="italic">API 正常時以 FastAPI + SQL 為單一資料來源；不可用時前端降級為本機 demo，不阻塞互動。</text>
      </svg>
    </div>
  </div>
</body>
</html>
