<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情緒垃圾車 · bags 結算流向</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f2e6d8;
      --color-ink:     #593e2e;
      --color-muted:   #63554b;
      --color-accent:  #8c5b3e;
      --color-moss:    #555934;
      --color-sand:    #bf9b7a;
      --font-sans:     'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    .diagram-container { width: 100%; overflow-x: auto; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="eyebrow">Settlement · one trip</div>
    <h1>bags 結算流向</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="emotion-sankey-title emotion-sankey-desc">
        <title id="emotion-sankey-title">bags 結算流向</title>
        <desc id="emotion-sankey-desc">單趟 100 包示例：75 包由 CAREFUL 與 THANKS 直接收走，25 包進入 RECYCLE；其中 15 包收走、10 包保留，最終 COLLECTED 90 包、剩餘 10 包。</desc>
        <defs>
          <marker id="sankey-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#63554b"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f2e6d8"/>

        <text x="60" y="36" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">ONE TRIP · 100 BAGS EXAMPLE · k = 2 px / bag</text>

        <!-- column headers -->
        <text x="180" y="64" fill="#63554b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">STAGE 1</text>
        <text x="480" y="64" fill="#63554b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">STAGE 2</text>
        <text x="840" y="64" fill="#63554b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">STAGE 3</text>

        <!-- ===== COLUMN 1: ACCUMULATING 100 ===== -->
        <rect x="160" y="200" width="12" height="200" fill="#593e2e"/>
        <text x="152" y="292" fill="#593e2e" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="end">ACCUMULATING</text>
        <text x="152" y="308" fill="#63554b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">累積 bags</text>
        <text x="152" y="324" fill="#63554b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">100 包</text>

        <!-- ===== RIBBONS ===== -->
        <!-- 100 → 75 順利收走 -->
        <path d="M 172,200 C 300,200 300,80 450,80 L 462,230 C 300,230 300,350 172,350 Z" fill="#555934" opacity="0.18"/>
        <!-- 100 → 25 回收保留 -->
        <path d="M 172,350 C 300,350 300,370 450,370 L 462,420 C 300,420 300,400 172,400 Z" fill="#bf9b7a" opacity="0.18"/>
        <!-- 75 → COLLECTED -->
        <path d="M 462,80 C 635,80 635,60 820,60 L 832,210 C 635,210 635,230 462,230 Z" fill="#555934" opacity="0.18"/>
        <!-- 25 RECYCLE → 15 COLLECTED (focal) -->
        <path d="M 462,370 C 635,370 635,210 820,210 L 832,240 C 635,240 635,400 462,400 Z" fill="#8c5b3e" opacity="0.28"/>
        <!-- 25 RECYCLE → 10 剩餘 -->
        <path d="M 462,400 C 635,400 635,390 820,390 L 832,410 C 635,410 635,420 462,420 Z" fill="#bf9b7a" opacity="0.18"/>

        <!-- flow labels -->
        <rect x="250" y="122" width="64" height="14" rx="2" fill="#f2e6d8"/>
        <text x="282" y="133" fill="#555934" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">75 包</text>
        <rect x="250" y="330" width="64" height="14" rx="2" fill="#f2e6d8"/>
        <text x="282" y="374" fill="#8c5b3e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">25 包</text>
        <rect x="620" y="288" width="64" height="14" rx="2" fill="#f2e6d8"/>
        <text x="652" y="299" fill="#8c5b3e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">15 包</text>
        <rect x="620" y="398" width="64" height="14" rx="2" fill="#f2e6d8"/>
        <text x="652" y="409" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10 包</text>

        <!-- ===== COLUMN 2 ===== -->
        <rect x="450" y="80" width="12" height="150" fill="#555934"/>
        <text x="480" y="146" fill="#593e2e" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">順利收走</text>
        <text x="480" y="162" fill="#63554b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CAREFUL + THANKS</text>
        <text x="480" y="178" fill="#63554b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">75 包</text>

        <rect x="450" y="370" width="12" height="50" fill="#bf9b7a"/>
        <text x="480" y="386" fill="#593e2e" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">回收保留</text>
        <text x="480" y="402" fill="#63554b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RECYCLE</text>
        <text x="480" y="418" fill="#63554b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">25 包</text>

        <!-- ===== COLUMN 3 ===== -->
        <rect x="820" y="60" width="12" height="180" fill="#555934"/>
        <text x="850" y="140" fill="#593e2e" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif">COLLECTED</text>
        <text x="850" y="156" fill="#63554b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">收走總數</text>
        <text x="850" y="172" fill="#63554b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">90 包</text>

        <rect x="820" y="390" width="12" height="20" fill="#bf9b7a"/>
        <text x="850" y="392" fill="#593e2e" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif">剩餘 bags</text>
        <text x="850" y="408" fill="#63554b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">RECYCLE 保留</text>
        <text x="850" y="424" fill="#63554b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">10 包</text>

        <!-- ===== LEGEND ===== -->
        <line x1="60" y1="500" x2="900" y2="500" stroke="rgba(89,62,46,0.10)" stroke-width="0.8"/>
        <text x="60" y="518" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="78" y="532" width="16" height="10" rx="2" fill="#555934" opacity="0.18"/>
        <text x="102" y="541" fill="#63554b" font-size="8.5" font-family="'Geist', 'Noto Sans TC', sans-serif">普通流向</text>

        <rect x="200" y="532" width="16" height="10" rx="2" fill="#8c5b3e" opacity="0.28"/>
        <text x="224" y="541" fill="#63554b" font-size="8.5" font-family="'Geist', 'Noto Sans TC', sans-serif">編輯焦點：RECYCLE → COLLECTED</text>

        <text x="78" y="566" fill="#63554b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-style="italic">N = 原有 bags；N = 0 時保留 0 包。15 / 10 為 25 包回收後的示例拆分，實際保留量隨機。</text>
      </svg>
    </div>
  </div>
</body>
</html>
